[tool.mypy]
python_version = "3.12"
strict = true
files = ["agent", "tests"]

# The official environment and cloudpickle ship without type stubs; the
# diagnostics package only touches them through a thin, runtime-probed API.
[[tool.mypy.overrides]]
module = ["kaggle_environments", "kaggle_environments.*", "cloudpickle", "pytest", "psutil", "torch", "torch.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["agent/environment", "tests"]
markers = [
    "integration: tests that launch the real Kaggle environment (skipped when unavailable)",
]
